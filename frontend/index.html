<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QUAN LY SAN PHAM</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f6f9;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      background: #007bff;
      color: white;
      padding: 20px;
      margin: 0;
    }

    .container {
      margin: 30px auto;
      width: 400px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 2px;
    }

    .btn-add {
      background: #28a745;
      color: white;
    }

    .btn-view {
      background: #17a2b8;
      color: white;
    }

    .btn-edit {
      background: #ffc107;
      color: black;
    }

    .btn-delete {
      background: #dc3545;
      color: white;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #eee;
      margin: 5px 0;
      padding: 10px;
      border-radius: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions {
      display: flex;
    }
  </style>
</head>

<body>

  <h1>QUAN LY SAN PHAM</h1>

  <div class="container">
    <input placeholder="Ten san pham"/>
    <input placeholder="Gia"/>
    <br>
    <button class="btn-add">Them san pham</button>

    <h3>Danh sach san pham</h3>
    <ul>
      <li>
        Cushion - 100000 VND
        <div class="actions">
          <button class="btn-view">Xem</button>
          <button class="btn-edit">Sửa</button>
          <button class="btn-delete">Xóa</button>
        </div>
      </li>

      <li>
        Kem chống nắng - 200000 VND
        <div class="actions">
          <button class="btn-view">Xem</button>
          <button class="btn-edit">Sửa</button>
          <button class="btn-delete">Xóa</button>
        </div>
      </li>
    </ul>
  </div>
  
</body>
</html>
